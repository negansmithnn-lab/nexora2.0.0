<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">

    <title>علوم هشتم | NEXORA</title>

    <link rel="stylesheet" href="../grade.css">
</head>

<body>

    <header class="grade-header">
        <div class="container grade-nav">

            <a href="../index.html" class="grade-logo">
                NEXORA<span>.</span>
            </a>

            <a href="../index.html" class="back-home">
                بازگشت به صفحه اصلی ←
            </a>

        </div>
    </header>


    <main>

        <section class="grade-hero">
            <div class="container">

                <span class="grade-label">SCIENCE / GRADE 08</span>

                <h1>علوم هشتم</h1>

                <p>
                    آموزش ویدیویی فصل‌های علوم پایه هشتم
                    در یک مسیر ساده و منظم.
                </p>

            </div>
        </section>


        <section class="lessons-section container">

            <div class="lessons-heading">

                <h2>فهرست درس‌ها</h2>

                <span class="lesson-count">
                    16 VIDEOS
                </span>

            </div>

            <div class="lesson-grid" id="lessonGrid">
                <!-- کارت‌های درس با JavaScript ساخته می‌شوند -->
            </div>

        </section>

    </main>


    <div class="video-modal" id="videoModal">

        <div class="video-box">

            <div class="video-top">

                <h3 id="videoTitle">پخش ویدیو</h3>

                <button class="video-close" id="closeVideo" type="button" aria-label="بستن ویدیو">
                    ×
                </button>

            </div>

            <div class="video-player" id="videoPlayer"></div>

        </div>

    </div>


    <footer class="grade-footer">
        <div class="container">
            <p>شکست همیشه باعث بهبود می‌شود. | NEXORA</p>
        </div>
    </footer>


    <script src="../grade.js"></script>

</body>

</html>
